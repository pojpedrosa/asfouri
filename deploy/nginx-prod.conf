# Production: asfouri.media
# Place at /etc/nginx/sites-available/asfouri-prod and symlink into sites-enabled.
# SSL is reused from the existing certbot cert for asfouri.media.

server {
    server_name asfouri.media www.asfouri.media;

    root /var/www/asfouri-prod/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    charset utf-8;
    client_max_body_size 25M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire/Filament serve their JS dynamically via PHP — must NOT hit the
    # static-asset rule below (^~ wins over the regex location).
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Static assets — long cache
    location ~* \.(?:css|js|woff2?|ttf|svg|jpg|jpeg|png|webp|gif|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/asfouri.media/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asfouri.media/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.asfouri.media) {
        return 301 https://asfouri.media$request_uri;
    }
    if ($host = asfouri.media) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name asfouri.media www.asfouri.media;
    return 404;
}
